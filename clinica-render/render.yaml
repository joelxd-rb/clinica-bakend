services:
  - type: web
    name: clinica-api
    env: node
    buildCommand: npm install
    startCommand: node index.js
    rootDir: server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
        
databases:
  - name: clinica-db
    databaseName: clinica
    user: clinica_user
    plan: free
